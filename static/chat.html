<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RIDE EZ · UMass Boston Assistant</title>
  <link rel="icon" href="/umb_icon.png" />
  <link rel="stylesheet" href="/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <header class="header">
    <img src="/umb_icon.png" alt="UMass Boston" class="header-logo" />
    <div class="header-text">
      <h1>RIDE EZ · UMass Boston Assistant</h1>
      <p>Ask about parking permits, rates, fines, shuttles, and commuting</p>
    </div>
    <nav class="header-nav">
      <a href="/" class="nav-link">Map</a>
    </nav>
  </header>

  <main class="chat-window" id="chatWindow">
    <div class="messages" id="messages">
      <div class="message bot">
        <div class="avatar">P</div>
        <div class="bubble">
          Hi! I can help you with parking permits, rates, fines, shuttle buses, MBTA passes, and commuting options at UMass Boston. What would you like to know?
        </div>
      </div>
    </div>
  </main>

  <footer class="input-bar">
    <form class="input-form" id="inputForm">
      <input
        type="text"
        id="userInput"
        placeholder="Ask about parking permits, rates, fines, shuttles, MBTA…"
        autocomplete="off"
        autofocus
      />
      <button type="submit" id="sendBtn" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </form>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
