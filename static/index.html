<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RIDE EZ · UMass Boston</title>
  <link rel="icon" href="/umb_icon.png" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body class="map-page">

  <header class="header">
    <button id="hamburgerBtn" class="hamburger-btn" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <img src="/umb_icon.png" alt="UMass Boston" class="header-logo" />
    <div class="header-text">
      <h1>RIDE EZ · UMass Boston</h1>
      <p>Find a stop, arrival, route, parking lot, or building</p>
    </div>
    <nav class="header-nav">
      <a href="/" class="nav-link active">Map</a>
    </nav>
  </header>

  <!-- Side info menu -->
  <div class="side-menu" id="sideMenu">
    <div class="side-menu-header">
      <span>Campus Info</span>
      <button id="closeMenu" class="side-menu-close" aria-label="Close">✕</button>
    </div>
    <nav class="side-menu-nav">
      <a href="/parking-rates" class="side-menu-link">
        <span>Parking Rates</span>
        <span class="side-menu-arrow">›</span>
      </a>
      <a href="/blue-bikes" class="side-menu-link">
        <span>Blue Bikes &amp; Scooters</span>
        <span class="side-menu-arrow">›</span>
      </a>
      <a href="/transit" class="side-menu-link">
        <span>Buses &amp; Trains</span>
        <span class="side-menu-arrow">›</span>
      </a>
    </nav>
  </div>

  <div class="map-wrap">
    <div id="map"></div>

    <button id="locateBtn" class="locate-btn" title="Show my location" aria-label="Show my location">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
        <circle cx="12" cy="12" r="8" stroke-dasharray="2 3"/>
      </svg>
    </button>

    <!-- Coordinate tracker -->
    <div class="coord-display" id="coordDisplay">Move mouse over map</div>

    <!-- Legend -->
    <div class="map-legend">
      <div class="legend-item"><span class="map-pin pin-garage legend-pin">P</span> Garage</div>
      <div class="legend-item"><span class="map-pin pin-lot legend-pin">P</span> Surface Lot</div>
      <div class="legend-item"><span class="map-pin pin-shuttle legend-pin">S</span> Shuttle Stop</div>
      <div class="legend-item"><span class="map-pin pin-mbta legend-pin">T</span> MBTA Station</div>
      <div class="legend-item"><span class="map-pin pin-building legend-pin">B</span> Building</div>
      <div class="legend-item"><span class="map-pin pin-dropoff legend-pin">D</span> Drop-Off</div>
    </div>

    <!-- Detail panel -->
    <div class="detail-panel" id="detailPanel">
      <button class="panel-close" id="closePanel" aria-label="Close">✕</button>
      <div class="panel-body" id="panelBody"></div>
    </div>
  </div>

  <script src="/api-config.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/map.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="/widget.js"></script>
</body>
</html>
